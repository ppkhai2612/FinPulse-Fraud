# docs: https://trino.io/docs/current/connector/hive.html
connector.name=hive

# Metastore (thrift)
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083

# File system (HDFS)
fs.hadoop.enabled=true
hive.config.resources=/etc/hadoop/conf/core-site.xml,/etc/hadoop/conf/hdfs-site.xml

# Enable writes to non-managed (external) Hive tables
# That is, tables registered against pre-existing HDFS Parquet via CREATE EXTERNAL TABLE
hive.non-managed-table-writes-enabled=true

# Access Parquet columns by name
hive.parquet.use-column-names=true