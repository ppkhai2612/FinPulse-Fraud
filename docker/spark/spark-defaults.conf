# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
# spark.master                     spark://master:7077
# spark.eventLog.enabled           true
# spark.eventLog.dir               hdfs://namenode:8021/directory
# spark.serializer                 org.apache.spark.serializer.KryoSerializer
# spark.driver.memory              5g
# spark.executor.extraJavaOptions  -XX:+PrintGCDetails -Dkey=value -Dnumbers="one two three"


# Tell Spark to use the Hive catalog implementation
# With this on, the SparkSession picks up hive-site.xml from HADOOP_CONF_DIR
# and routes `df.write.saveAsTable(...)` / `spark.sql("CREATE TABLE ...")` through HMS
spark.sql.catalogImplementation    hive

# The default location for managed databases and tables
# MUST agree with metastore.warehouse.dir in docker/hive-metastore/metastore-site.xml
spark.sql.warehouse.dir	           hdfs://namenode:9000/warehouse