x-airflow-common:
  &airflow-common
  image: apache/airflow:3.0.6
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-docker==7.2.0}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ./spark_jobs:/opt/jobs
    - /var/run/docker.sock:/var/run/docker.sock # run docker in docker
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
  networks:
    - finpulse-network
  group_add: # add "airflow" user to "docker" group, so, it can access /var/run/docker.sock
    - 998

services:
  
  # ===HDFS===
  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    hostname: namenode
    user: root
    ports:
      - "9870:9870"  # NameNode Web UI
      - "9000:9000"  # HDFS
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./docker/hadoop-server/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./docker/hadoop-server/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    command:
      - bash
      - -c
      - |
        if [ ! -d /hadoop/dfs/name/current ]; then
          echo "Formatting NameNode..."
          hdfs namenode -format -clusterid finpulse -nonInteractive
        fi
        exec hdfs namenode # hdfs becomes the container's PID 1 (not bash), allow receiving any Unix signals sent to the container
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      
  datanode-1:
    image: apache/hadoop:3.5.0
    container_name: datanode-1
    hostname: datanode-1
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode1-data:/hadoop/dfs/data
      - ./docker/hadoop-server/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop-server/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - finpulse-network

  datanode-2:
    image: apache/hadoop:3.5.0
    container_name: datanode-2
    hostname: datanode-2
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode2-data:/hadoop/dfs/data
      - ./docker/hadoop-server/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop-server/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - finpulse-network

  # ===Spark===
  spark-master:
    image: apache/spark:4.0.0
    container_name: spark-master
    user: root
    networks:
      - finpulse-network
    ports:
      - 7077:7077 # Spark master RPC port
      - 8080:8080 # Spark master web UI port
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop-conf
      - SPARK_NO_DAEMONIZE=true # run Spark master in the foreground
    volumes:
      - ./docker/hadoop-client:/opt/hadoop-conf
      - ./docker/spark:/opt/spark/conf
      - ./spark_jobs:/opt/spark/work-dir/jobs
      - ./pinot-offline:/opt/pinot-offline
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    # mem_limit: 1024m # 0.5GB
    
  spark-worker-1:
    image: apache/spark:4.0.0
    container_name: spark-worker-1
    user: root
    depends_on:
      - spark-master
    networks:
      - finpulse-network
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop-conf
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./docker/hadoop-client:/opt/hadoop-conf
      - ./docker/spark:/opt/spark/conf
      - ./spark_jobs:/opt/spark/work-dir/jobs
      - ./pinot-offline:/opt/pinot-offline
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    mem_limit: 1536m # 1.5GB
  
  spark-worker-2:
    image: apache/spark:4.0.0
    container_name: spark-worker-2
    depends_on:
      - spark-master
    networks:
      - finpulse-network
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop-conf
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./docker/hadoop-client:/opt/hadoop-conf
      - ./docker/spark:/opt/spark/conf
      - ./jobs:/opt/spark/work-dir/jobs
      - ./pinot-offline:/opt/pinot-offline
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
    mem_limit: 1536m

  # ===Kafka===
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    user: "0:0"
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0 
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACOTR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9094 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
  
  # kafdrop:
  #   image: obsidiandynamics/kafdrop:latest
  #   container_name: kafdrop
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     - KAFKA_BROKERCONNECT=kafka:9094
  #   ports:
  #     - "9001:9000"  # UI on localhost:9001 (9000 is taken by HDFS RPC)
  #   networks:
  #     - finpulse-network

  kafka-producer:
    image: python:3.11-slim-bullseye
    container_name: kafka-producer
    volumes: 
      - ./kafka_producers:/opt/producers
      - ./data:/opt/data
    command:
      - bash
      - -c
      - "pip install --no-cache-dir kafka-python==2.0.3 && exec sleep infinity"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - finpulse-network
    restart: unless-stopped

  # ===Airflow===
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - finpulse-network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ===Pinot===
  pinot-zookeeper:
    image: zookeeper:3.9
    container_name: pinot-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - pinot-zk-data:/data
      - pinot-zk-datalog:/datalog
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  
  pinot-controller:
    image: apachepinot/pinot:1.2.0
    container_name: pinot-controller
    volumes:
      - pinot-controller-data:/opt/pinot/data/controller
      - ./pinot-offline:/opt/pinot/data/pinot-offline
      - ./pinot_conf:/opt/pinot/conf
    ports:
      - "9100:9000"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
    command:
      - StartController
      - -zkAddress
      - pinot-zookeeper:2181
      - -clusterName
      - finpulse
      - -controllerPort
      - "9000"
      - -dataDir
      - /opt/pinot/data/controller
    depends_on:
      pinot-zookeeper:
        condition: service_healthy
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  
  pinot-broker:
    image: apachepinot/pinot:1.2.0
    container_name: pinot-broker
    ports:
      - "8099:8099"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
    command:
      - StartBroker
      - -zkAddress
      - pinot-zookeeper:2181
      - -clusterName
      - finpulse
      - -brokerHost
      - pinot-broker
      - -brokerPort
      - "8099"
    depends_on:
      pinot-controller:
        condition: service_healthy
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  
  pinot-server: # hosting segments and query execution
    image: apachepinot/pinot:1.2.0
    container_name: pinot-server
    volumes:
      - pinot-server-data:/opt/pinot/data/server
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g -XX:+UseG1GC
    command:
      - StartServer
      - -zkAddress
      - pinot-zookeeper:2181
      - -clusterName
      - finpulse
      - -serverHost
      - pinot-server
      - -serverPort
      - "8098"
      - -serverAdminPort
      - "8097"
      - -dataDir
      - /opt/pinot/data/server/index
      - -segmentDir
      - /opt/pinot/data/server/segment
    depends_on:
      pinot-broker:
        condition: service_healthy
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health/readiness || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ===Hive Metastore===
  # See the docs: https://hive.apache.org/docs/latest/admin/adminmanual-metastore-administration/
  metastore-db:
    image: postgres:16
    container_name: metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hive"]
      interval: 5s
      retries: 10
    networks:
      - finpulse-network

  hive-metastore-init:
    image: apache/hive:4.0.0
    container_name: hive-metastore-init
    user: root
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
    volumes:
      - ./docker/hive-metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml
      - ./docker/hive-metastore/jars:/opt/hive/jdbc
      - ./docker/hadoop-client:/opt/hadoop/conf
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # Sanity: Postgres JDBC driver must be present on the host
        if ! ls /opt/hive/jdbc/postgresql-*.jar > /dev/null 2>&1; then
          echo "ERROR: Postgres JDBC driver missing in ./docker/hive-metastore/jars/"
          echo "Run 'make hive-deps' to download it"
          exit 1
        fi
        cp /opt/hive/jdbc/postgresql-*.jar /opt/hive/lib/
        # Idempotent schema init: 
        if /opt/hive/bin/schematool -dbType postgres -info > /dev/null 2>&1; then
          echo "HMS schema has already been initialized - skipping schematool"
        else
          echo "Initializing HMS schema in metastore-db..."
          /opt/hive/bin/schematool -dbType postgres -initSchema --verbose
        fi
        # ensure the HDFS /warehouse root exists
        /opt/hadoop/bin/hdfs dfs -mkdir -p /warehouse 2>/dev/null || true
        echo "HMS init completed"
    depends_on:
      metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy
    networks:
      - finpulse-network
    restart: "no"

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    user: root
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true" # skip schematool
      HADOOP_CONF_DIR: /opt/hadoop/conf
    volumes:
      - ./docker/hive-metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml
      - ./docker/hive-metastore/jars:/opt/hive/jdbc
      - ./docker/hadoop-client:/opt/hadoop/conf
    entrypoint:
      - bash
      - -c
      - |
        set -e
        cp /opt/hive/jdbc/postgresql-*.jar /opt/hive/lib/
        exec /entrypoint.sh
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
    networks:
      - finpulse-network
    healthcheck:
      # HMS exposes Thrift on 9083 — no HTTP endpoint, so just probe TCP.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===Trino===
  trino-coordinator:
    image: trinodb/trino:481
    container_name: trino-coordinator
    user: root
    ports:
      - "8086:8080"
    volumes:
      - ./docker/trino_etc:/etc/trino
      - ./docker/hadoop-client:/etc/hadoop/conf
    depends_on:
      hive-metastore:
        condition: service_healthy
      namenode:
        condition: service_healthy
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===Apache Superset===
  superset-init:
    image: apache/superset:4.1.1
    container_name: superset-init
    user: "root"      # need root to pip-install requirements-local.txt
    command: ["/app/superset-init.sh"]
    environment:
      - SUPERSET_SECRET_KEY=dev-secret-change-me
      - SUPERSET_LOAD_EXAMPLES=no
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_FIRSTNAME=Admin
      - ADMIN_LASTNAME=User
      - ADMIN_EMAIL=admin@finpulse.local
    volumes:
      - superset-data:/app/superset_home
      - ./docker/superset/requirements-local.txt:/app/docker/requirements-local.txt
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./docker/superset/superset-init.sh:/app/superset-init.sh
    networks:
      - finpulse-network
    restart: "no"

  superset:
    image: apache/superset:4.1.1
    container_name: superset
    user: "root"
    command: ["/app/superset-bootstrap.sh"]
    environment:
      - SUPERSET_SECRET_KEY=dev-secret-change-me
      - SUPERSET_LOAD_EXAMPLES=no
    ports:
      - "8088:8088"   # BI web UI
    volumes:
      - superset-data:/app/superset_home
      - ./docker/superset/requirements-local.txt:/app/docker/requirements-local.txt:ro
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/superset-bootstrap.sh:/app/superset-bootstrap.sh:ro
    depends_on:
      superset-init:
        condition: service_completed_successfully
    networks:
      - finpulse-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s   # gunicorn cold start + pip-install pinotdb on first run
    restart: unless-stopped


  # ===Apache Flink===
  


volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  kafka-data:
  postgres-data:
  pinot-zk-data:
  pinot-zk-datalog:
  pinot-controller-data:
  pinot-server-data:
  metastore-db-data:
  superset-data:


networks:
  finpulse-network:
    driver: bridge